name: AI access test
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Try GitHub Models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1; do
            echo "== $m"
            curl -s -w "\nHTTP %{http_code}\n" https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"उत्तराखंड की राजधानी? एक शब्द में।\"}],\"max_tokens\":20}" | tail -c 400
          done
