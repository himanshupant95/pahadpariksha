name: AI access test
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi in Hindi"}],"max_tokens":20}'
          B2='{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi in Hindi"}],"max_tokens":20}'
          for U in https://models.github.ai/inference/chat/completions "https://models.github.ai/orgs/himanshupant95/inference/chat/completions"; do
            echo "== $U"; curl -sS -i "$U" -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$B" | head -c 700; echo
          done
          echo "== azure"; curl -sS -i https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$B2" | head -c 700; echo
          echo "== catalog"; curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $T" | head -c 400
