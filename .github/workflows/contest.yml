name: Weekly quiz contest

# Sunday 10:07 AM IST: 20 quiz polls in the discussion group. Sunday 9:07 PM IST: close and announce winners.
# Answers are recorded by the Cloudflare Worker (cloudflare/telegram-worker.js, KV binding CONTEST).
# Second cron of each pair is a safety net; src/data/contest-state.json makes repeats a no-op.
on:
  schedule:
    - cron: '37 4 * * 0'   # Sun 10:07 AM IST start
    - cron: '13 6 * * 0'   # Sun 11:43 AM IST start (safety net)
    - cron: '37 15 * * 0'  # Sun 9:07 PM IST results
    - cron: '19 17 * * 0'  # Sun 10:49 PM IST results (safety net)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check | selftest | start | finish'
        default: check
      test:
        description: 'Send to the owner chat only (no state saved)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: contest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '' }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            # GitHub can run scheduled jobs hours late (22 Nov: the Sunday-night runs fired at 2:42 and 4:02 AM Monday
            # and were read as "start"). Decide by IST day + hour: start only on Sunday 6 AM–3 PM, finish on Sunday
            # evening or (late runs) Monday before noon; anything else is a no-op.
            D=$(TZ=Asia/Kolkata date +%u); H=$((10#$(TZ=Asia/Kolkata date +%H)))
            if [ "$D" = "7" ] && [ "$H" -ge 6 ] && [ "$H" -lt 15 ]; then MODE=start
            elif { [ "$D" = "7" ] && [ "$H" -ge 15 ]; } || { [ "$D" = "1" ] && [ "$H" -lt 12 ]; }; then MODE=finish
            else echo "Outside the contest window (IST day $D, hour $H) — nothing to do."; exit 0; fi
          fi
          node scripts/contest.mjs "$MODE"
      - name: Save state
        run: |
          [ "$(cat contest-changed 2>/dev/null)" = "1" ] || { echo "Nothing to save."; exit 0; }
          git config user.name "contest-bot"
          git config user.email "contest-bot@users.noreply.github.com"
          # add each file on its own: one missing path made the old combined `git add` fail and save nothing
          for f in src/data/contest-state.json src/data/contest-results.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "Nothing staged."; exit 0; }
          git commit -m "Quiz contest state [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
