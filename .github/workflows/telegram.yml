name: Telegram review commands

# Reads the owner's replies to the nightly review message (/remove, /edit, /ok) every ~10 minutes,
# 5:30 AM–11:20 PM IST, applies them to src/data/digest.json and redeploys.
on:
  schedule:
    - cron: '*/10 0-17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read and apply replies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram.mjs poll
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$(cat review-changed 2>/dev/null)" = "1" ] || { echo "No changes."; exit 0; }
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add src/data/digest.json
          git commit -m "Current affairs review via Telegram [skip ci]"
          git pull --rebase origin main
          git push
          gh workflow run deploy.yml --ref main
