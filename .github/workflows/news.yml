name: Uttarakhand current-affairs tracker

# Daily edition: headlines are collected at ~12:10 PM IST (no AI) and again just after midnight IST,
# then ONE AI pass turns the previous day's headlines into exam points and the site is rebuilt.
on:
  schedule:
    - cron: '41 6 * * *'   # 12:11 PM IST — collect headlines only
    - cron: '35 18 * * *'  # 12:05 AM IST — collect + AI daily edition + deploy
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect = headlines only; edition = headlines + AI + deploy; preview = dry run; backfill = add details to older points'
        default: edition
        type: choice
        options: [edition, collect, preview, backfill]

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.schedule == '41 6 * * *' && 'collect' || (github.event.inputs.mode || 'edition') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect headlines
        run: node scripts/fetch-news.mjs
      - name: AI preview on today's headlines (saves nothing)
        if: env.MODE == 'preview'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PREVIEW: '1'
        run: node scripts/digest-news.mjs
      - name: AI daily edition (previous day)
        if: env.MODE == 'edition'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/digest-news.mjs
      - name: Add details to older points
        if: env.MODE == 'backfill'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKFILL: '1'
        run: node scripts/digest-news.mjs
      - name: Commit and redeploy
        if: env.MODE != 'preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ADDED=0
          [ -f new-digest.json ] && ADDED=$(node -e "console.log(require('./new-digest.json').added)")
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add src/data/news.json src/data/digest.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Current affairs ($MODE): +$ADDED exam points [skip ci]"
          git pull --rebase origin main
          git push
          if [ "$MODE" = "edition" ] || [ "$MODE" = "backfill" ]; then gh workflow run deploy.yml --ref main; fi
