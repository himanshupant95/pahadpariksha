name: Uttarakhand current-affairs tracker

# Daily edition: headlines are collected at ~12:10 PM IST (no AI) and again just after midnight IST,
# then ONE AI pass turns the previous day's headlines into exam points and the site is rebuilt.
on:
  schedule:
    - cron: '41 6 * * *'   # 12:11 PM IST — collect headlines only
    - cron: '35 18 * * *'  # 12:05 AM IST — collect + AI daily edition + deploy
    - cron: '47 20 * * *'  # 2:17 AM IST — safety net if GitHub delayed/dropped the run above (no-op if done)
    - cron: '23 23 * * *'  # 4:53 AM IST — second safety net
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect = headlines only; edition = headlines + AI + deploy; preview = dry run; backfill = add details to older points; check = grade the sample with the fact-checker (dry)'
        default: edition
        type: choice
        options: [edition, collect, preview, backfill, check, probe]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event.schedule == '41 6 * * *' && 'collect' || (github.event.inputs.mode || 'edition') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe publisher feeds
        if: env.MODE == 'probe'
        run: node scripts/probe-feeds.mjs
      - name: Collect headlines
        if: env.MODE != 'probe'
        run: node scripts/fetch-news.mjs
      - name: AI preview on today's headlines (saves nothing)
        if: env.MODE == 'preview'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PREVIEW: '1'
        run: node scripts/digest-news.mjs
      - name: AI daily edition (previous day)
        if: env.MODE == 'edition'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/digest-news.mjs
      - name: Fact-checker test on the saved sample (saves nothing)
        if: env.MODE == 'check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHECK: '1'
        run: node scripts/digest-news.mjs
      - name: Add details to older points
        if: env.MODE == 'backfill'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKFILL: '1'
        run: node scripts/digest-news.mjs
      - name: Send review (Telegram, else GitHub issue)
        if: env.MODE == 'edition'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          node scripts/telegram.mjs send; rc=$?
          set -e
          if [ $rc -ne 0 ]; then echo "telegram rc=$rc -> GitHub issue"; node scripts/review-issue.mjs || echo "review issue failed (edition is still live)"; fi
      - name: Commit and redeploy
        if: env.MODE != 'preview' && env.MODE != 'check' && env.MODE != 'probe'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ADDED=0
          [ -f new-digest.json ] && ADDED=$(node -e "console.log(require('./new-digest.json').added)")
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add src/data/news.json src/data/digest.json
          [ -d .review ] && git add .review
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Current affairs ($MODE): +$ADDED exam points [skip ci]"
          git pull --rebase origin main
          git push
          if [ "$MODE" = "edition" ] || [ "$MODE" = "backfill" ]; then gh workflow run deploy.yml --ref main; fi
